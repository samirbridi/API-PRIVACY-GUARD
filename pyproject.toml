[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-privacy-guard"
version = "0.1.0"
description = "Local access broker for AI coding agents: MCP, SSH and scoped API tokens"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3", "keyring>=25,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
network = ["psutil>=6,<9"]

[project.scripts]
api-privacy-guard = "api_privacy_guard.cli:main"

[tool.setuptools.packages.find]
include = ["api_privacy_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
